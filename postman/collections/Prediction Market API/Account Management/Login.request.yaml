$kind: http-request
method: POST
url: "{{baseUrl}}/api/login"
order: 2000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "rawPassword": "password123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code !== 200) {
        throw new Error(`Login failed with status ${pm.response.code}`);
      }

      const response = pm.response.json();
      if (typeof response.token !== 'string' || response.token.length === 0) {
        throw new Error('Login response did not include a token');
      }
      if (typeof response.userId !== 'string' || response.userId.length === 0) {
        throw new Error('Login response did not include a user ID');
      }

      pm.environment.set('jwt', response.token);
      pm.environment.set('userId', response.userId);

      pm.sendRequest({
        url: pm.variables.replaceIn('{{baseUrl}}/api/login'),
        method: 'POST',
        header: {
          'Content-Type': 'application/json',
        },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: 'unknown@example.invalid',
            rawPassword: 'incorrect-password',
          }),
        },
      }, (error, invalidResponse) => {
        pm.test('returns 401 for invalid login credentials', () => {
          pm.expect(error).to.eql(null);
          pm.expect(invalidResponse.code).to.eql(401);
          pm.expect(invalidResponse.json()).to.eql({
            error: 'INVALID_CREDENTIALS',
            message: 'Invalid email or password',
          });
        });
      });
