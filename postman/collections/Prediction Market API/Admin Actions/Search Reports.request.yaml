$kind: http-request
method: GET
url: '{{baseUrl}}/api/reports?reporterId={{reporterId}}&questionId={{questionId}}&reason={{reason}}'
order: 3000
queryParams:
  - key: reporterId
    value: '{{reporterId}}'
  - key: questionId
    value: '{{questionId}}'
  - key: reason
    value: '{{reason}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jwt}}'
