$kind: http-request
method: POST
url: '{{baseUrl}}/api/questions/{{questionId}}/place-wager'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "side": "yes",
      "amount": 50
    }
pathVariables:
  questionId: '{{questionId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jwt}}'
