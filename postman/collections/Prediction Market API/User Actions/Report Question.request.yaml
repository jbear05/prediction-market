$kind: http-request
method: POST
url: '{{baseUrl}}/api/questions/{{questionId}}/report'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "This question is inappropriate."
    }
pathVariables:
  questionId: '{{questionId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jwt}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 201 Created', () => {
        pm.response.to.have.status(201);
      });

      pm.test('returns the created report ID', () => {
        const response = pm.response.json();
        pm.expect(response.id).to.match(/^[a-f\d]{24}$/i);
        pm.environment.set('reportId', response.id);
      });
