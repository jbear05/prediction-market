$kind: http-request
method: POST
url: '{{baseUrl}}/api/questions/{{questionId}}/report'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "This question is inappropriate."
    }
pathVariables:
  questionId: '{{questionId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jwt}}'
