$kind: http-request
method: GET
url: '{{baseUrl}}/api/balance'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jwt}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 200 OK', () => {
        pm.response.to.have.status(200);
      });

      pm.test('returns a non-negative integer balance', () => {
        const response = pm.response.json();
        pm.expect(response.balance).to.be.a('number');
        pm.expect(response.balance).to.be.at.least(0);
        pm.expect(Number.isInteger(response.balance)).to.be.true;
      });
