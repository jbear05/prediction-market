$kind: http-request
method: GET
url: '{{baseUrl}}/api/daily-claim'
order: 2500
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jwt}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 200 OK', () => {
        pm.response.to.have.status(200);
      });

      pm.test('returns the next claim time and eligibility', () => {
        const response = pm.response.json();
        pm.expect(response.nextClaimAt).to.be.a('string');
        pm.expect(Number.isNaN(Date.parse(response.nextClaimAt))).to.be.false;
        pm.expect(response.claimEligible).to.be.a('boolean');
      });
