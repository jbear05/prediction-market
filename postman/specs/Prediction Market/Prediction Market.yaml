openapi: 3.0.0
info:
  title: Prediction Market
  version: 1.0.0
  description: 'API collection for the Prediction Market app — account management, user actions, and admin actions.'
servers:
  - url: '{{baseUrl}}'
paths:
  /api/register:
    post:
      summary: Register User
      responses: {}
      tags:
        - Account Management
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                rawPassword:
                  type: string
            example:
              email: user@example.com
              displayName: John_Doe
              rawPassword: password123
  /api/login:
    post:
      summary: Login
      responses: {}
      tags:
        - Account Management
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                rawPassword:
                  type: string
            example:
              email: user@example.com
              rawPassword: password123
  /api/verify:
    post:
      summary: Verify User
      responses: {}
      tags:
        - Account Management
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                authCode:
                  type: string
                  format: color
            example:
              email: user@example.com
              authCode: '123456'
  /api/verify/resend:
    post:
      summary: Resend Verification Code
      responses: {}
      tags:
        - Account Management
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
            example:
              email: user@example.com
  /api/password/reset:
    post:
      summary: Get Password Reset Code
      responses: {}
      tags:
        - Account Management
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
            example:
              email: user@example.com
  /api/password/update:
    post:
      summary: Reset Password
      responses: {}
      tags:
        - Account Management
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                newPassword:
                  type: string
                authCode:
                  type: string
                  format: color
            example:
              email: user@example.com
              newPassword: newpassword123
              authCode: '123456'
  '/api/questions/{questionId}/resolve':
    post:
      summary: Resolve Question
      responses: {}
      tags:
        - Admin Actions
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: string
            example:
              outcome: 'yes'
    parameters:
      - name: questionId
        in: path
        required: true
        schema:
          type: string
        example: '{{questionId}}'
  '/api/questions/{questionId}/cancel':
    post:
      summary: Cancel Question
      responses: {}
      tags:
        - Admin Actions
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
    parameters:
      - name: questionId
        in: path
        required: true
        schema:
          type: string
        example: '{{questionId}}'
  /api/reports:
    get:
      summary: Search Reports
      parameters:
        - name: reporterId
          in: query
          schema:
            type: string
          example: '{{reporterId}}'
        - name: questionId
          in: query
          schema:
            type: string
          example: '{{questionId}}'
        - name: reason
          in: query
          schema:
            type: string
          example: '{{reason}}'
      responses: {}
      tags:
        - Admin Actions
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
  '/api/reports/{reportId}/resolve':
    post:
      summary: Resolve Report
      responses: {}
      tags:
        - Admin Actions
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                killQuestion:
                  type: boolean
            example:
              killQuestion: false
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
        example: '{{reportId}}'
  '/api/questions/{questionId}/place-wager':
    post:
      summary: Place Wager
      responses: {}
      tags:
        - User Actions
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                side:
                  type: string
                amount:
                  type: integer
            example:
              side: 'yes'
              amount: 50
    parameters:
      - name: questionId
        in: path
        required: true
        schema:
          type: string
        example: '{{questionId}}'
  /api/daily-claim:
    post:
      summary: Claim Daily Coins
      responses: {}
      tags:
        - User Actions
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
  '/api/questions/{questionId}/report':
    post:
      summary: Report Question
      responses: {}
      tags:
        - User Actions
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
            example:
              reason: This question is inappropriate.
    parameters:
      - name: questionId
        in: path
        required: true
        schema:
          type: string
        example: '{{questionId}}'
  /api/ping:
    get:
      summary: Ping
      responses: {}
      tags:
        - User Actions
  /api/questions:
    get:
      summary: Search Questions
      parameters:
        - name: q
          in: query
          schema:
            type: string
          example: '{{q}}'
        - name: category
          in: query
          schema:
            type: string
          example: '{{category}}'
        - name: status
          in: query
          schema:
            type: string
          example: '{{status}}'
        - name: sort
          in: query
          schema:
            type: string
          example: '{{sort}}'
        - name: page
          in: query
          schema:
            type: string
          example: '{{page}}'
        - name: limit
          in: query
          schema:
            type: string
          example: '{{limit}}'
      responses: {}
      tags:
        - User Actions
      security:
        - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
